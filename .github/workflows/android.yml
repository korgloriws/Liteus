name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure stable release signing
        run: |
          chmod +x scripts/setup-android-release-signing.sh
          scripts/setup-android-release-signing.sh

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Normalize gradlew line endings
        run: sed -i 's/\r$//' android/gradlew

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Ensure build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Print APK SHA-1 (obrigatório no Google Cloud)
        if: always()
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK não encontrado em $APK"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

          echo "=== SHA-1 do APK (cole no Client OAuth Android) ==="
          {
            keytool -printcert -jarfile "$APK" 2>/dev/null || true
            echo "---- apksigner ----"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null || \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null || \
            find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1 | xargs -I{} {} verify --print-certs "$APK" || true
          } | tee /tmp/apk-certs.txt

          SHA1=$(grep -oE '([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}' /tmp/apk-certs.txt | head -1 || true)
          echo ""
          echo "SHA1_EXTRAIDO=$SHA1"
          echo "SHA-1 ESPERADO (keystore do repo)=6C:BC:28:13:88:20:25:79:DE:76:8C:0F:86:C1:F8:19:10:2E:4E:3A"
          echo "SHA-1 do APK: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use no Google Cloud (package com.liteus.app): \`6C:BC:28:13:88:20:25:79:DE:76:8C:0F:86:C1:F8:19:10:2E:4E:3A\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts-meta
          echo "$SHA1" > artifacts-meta/sha1.txt
          echo "===================================================="

      - name: Upload SHA-1 text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-sha1
          path: artifacts-meta/sha1.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

